name: stone_payment_tech
description: Plugin Flutter para integrar sua aplicação com o SDK Android da Stone para meios de pagamento.
version: 1.1.0
repository: https://github.com/JY-Labtech/stone_payment_tech

environment:
  sdk: ">=3.1.5 <4.0.0"
  flutter: ">=2.5.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: br.com.jylabtech.stone_payment_tech
        pluginClass: StoneTechFlutterPlugin
