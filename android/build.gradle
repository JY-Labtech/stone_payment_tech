group 'br.com.jylabtech.stone_payment_tech'
version '1.0'

buildscript {
    ext {
        kotlin_version = '2.1.21'
        stone_sdk_version = '4.15.0'

        localProps = new Properties()
        fileName = 'local.properties'
        if (project.rootProject.file(fileName).exists()) {
            localProps.load(new FileInputStream(rootProject.file(fileName)))
        }

        // Licence Keys
        licenceKey = System.env.LICENCE_KEY ?: localProps.getProperty("licenceKey") ?: ""
        licenceInternalKey = System.env.LICENCE_INTERNAL_KEY ?: localProps.getProperty("licenceInternalKey") ?: ""

        if (!licenceKey || licenceKey == "") {
            throw new GradleException("LicenceKey não encontrado!!")
        }

        // licenceInternalKey é opcional: vazio ou fora do servidor oficial usa
        // https://portal-api.jylabtech.com.br/pos-payments/licence/check (LicenceConfig).

        // Tokens PackageCloud
        packageCloudReadToken = System.env.PACKAGECLOUD_READ_TOKEN != null ? System.env.PACKAGECLOUD_READ_TOKEN : localProps["packageCloudReadToken"] ?: ""
        packageCloudReadTokenInternal = System.env.PACKAGECLOUD_READ_TOKEN_INTERNAL ?: localProps["packageCloudReadTokenInternal"]

    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://packagecloud.io/priv/${packageCloudReadToken}/stone/pos-android/maven2" }
        maven { url "https://packagecloud.io/priv/${packageCloudReadTokenInternal}/stone/pos-android-internal/maven2" }
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

apply from: './keys/positivo/positivo-signing-config.gradle'
apply from: './keys/gertec/gertec-signing-config.gradle'
apply from: './keys/ingenico/ingenico-signing-config.gradle'
apply from: './keys/sunmi/sunmi-signing-config.gradle'
apply from: './keys/tectoy/tectoy-signing-config.gradle'

android {
    namespace = "br.com.jylabtech.stone_payment_tech"

    compileSdk = 35
    flavorDimensions = ["model"]

    buildFeatures {
        buildConfig = true
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    packagingOptions {
        exclude 'META-INF/api_release.kotlin_module'
        exclude 'META-INF/client_release.kotlin_module'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk = 22
        buildConfigField "String", "LICENCE_KEY", "\"${licenceKey}\""
        buildConfigField "String", "LICENCE_INTERNAL_KEY", "\"${licenceInternalKey}\""
    }

    signingConfigs {
        gertecGpos700 {
            storeFile gertecSigningConfig.storeFile
            keyAlias gertecSigningConfig.keyAlias
            keyPassword gertecSigningConfig.keyPassword
            storePassword gertecSigningConfig.storePassword
        }
        positivoStandard {
            storeFile positivoSigningConfig.storeFile
            keyAlias positivoSigningConfig.keyAlias
            keyPassword positivoSigningConfig.keyPassword
            storePassword positivoSigningConfig.storePassword
        }
        ingenicoStandard {
            storeFile ingenicoSigningConfig.storeFile
            keyAlias ingenicoSigningConfig.keyAlias
            keyPassword ingenicoSigningConfig.keyPassword
            storePassword ingenicoSigningConfig.storePassword
        }
        sunmiStandard {
            storeFile sunmiSigningConfig.storeFile
            keyAlias sunmiSigningConfig.keyAlias
            keyPassword sunmiSigningConfig.keyPassword
            storePassword sunmiSigningConfig.storePassword
        }
        tectoyStandard {
            storeFile tectoySigningConfig.storeFile
            keyAlias tectoySigningConfig.keyAlias
            keyPassword tectoySigningConfig.keyPassword
            storePassword tectoySigningConfig.storePassword
        }
    }

    productFlavors {
        gertecGpos700 {
            dimension "model"
            signingConfig signingConfigs.gertecGpos700
            versionNameSuffix "-gertecGpos700"
        }
        gertecGposSeries7 {
            dimension "model"
            signingConfig signingConfigs.gertecGpos700
            versionNameSuffix "-gertecGposSeries7"
        }
        positivoSeriesL {
            dimension "model"
            signingConfig signingConfigs.positivoStandard
            versionNameSuffix "-positivoSeriesL"
        }
        ingenico {
            dimension "model"
            signingConfig signingConfigs.ingenicoStandard
            versionNameSuffix "-ingenico"
        }
        sunmi {
            dimension "model"
            signingConfig signingConfigs.sunmiStandard
            versionNameSuffix "-sunmi"
        }
        sunmiSeriesP {
            dimension "model"
            signingConfig signingConfigs.sunmiStandard
            versionNameSuffix "-sunmiSeriesP"
        }
        tectoySeriesT {
            dimension "model"
            signingConfig signingConfigs.tectoyStandard
            versionNameSuffix "-tectoySeriesT"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.github.permissions-dispatcher:permissionsdispatcher:4.8.0'
    annotationProcessor "com.github.permissions-dispatcher:permissionsdispatcher-processor:4.8.0"
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'com.google.android.material:material:1.3.0'

    // RxJava
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'io.reactivex.rxjava3:rxjava:3.1.5'

    // Debug da Stone
    debugImplementation "com.github.tony19:logback-android:2.0.0"
    debugImplementation "br.com.stone.sdk.android:debugmode:4.0.3"

    // Stone SDK
    implementation "br.com.stone:stone-sdk:$stone_sdk_version"
    implementation "br.com.stone:stone-sdk-posandroid:$stone_sdk_version"
    ingenicoImplementation "br.com.stone:stone-sdk-posandroid-ingenico:$stone_sdk_version"
    sunmiImplementation "br.com.stone:stone-sdk-posandroid-sunmi:$stone_sdk_version"
    sunmiSeriesPImplementation "br.com.stone:stone-sdk-posandroid-sunmi:$stone_sdk_version"
    tectoySeriesTImplementation "br.com.stone:stone-sdk-posandroid-tectoy:$stone_sdk_version"
    gertecGpos700Implementation "br.com.stone:stone-sdk-posandroid-gertec:$stone_sdk_version"
    gertecGposSeries7Implementation "br.com.stone:stone-sdk-posandroid-gertec:$stone_sdk_version"
    positivoSeriesLImplementation "br.com.stone:stone-sdk-posandroid-positivo:$stone_sdk_version"

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"

    // Dependencias para módulo de licença (sem kapt)
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("androidx.security:security-crypto:1.1.0-alpha03")

    // Testes JVM da validação de licença (org.json do android.jar é stub)
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
